name: finance-manager-tests
services:
  db-test:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_USER: finance_test
      POSTGRES_DB: finance_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Set TEST_POSTGRES_PASSWORD}
    ports: ['127.0.0.1:5433:5432']
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U finance_test -d finance_test']
      interval: 5s
      timeout: 5s
      retries: 10
