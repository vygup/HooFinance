name: finance-manager
x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-finance}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL}
  APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?Set TOKEN_ENCRYPTION_KEY}
  SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
  TRUST_PROXY: 'true'
  TRUSTED_PROXY_SECRET: ${TRUSTED_PROXY_SECRET:?Set TRUSTED_PROXY_SECRET}
  AUTH_INVITE_TTL_SECONDS: ${AUTH_INVITE_TTL_SECONDS:-604800}
  AUTH_RESET_TTL_SECONDS: ${AUTH_RESET_TTL_SECONDS:-3600}
  AUTH_LOGIN_LIMIT: ${AUTH_LOGIN_LIMIT:-5}
  AUTH_WINDOW_SECONDS: ${AUTH_WINDOW_SECONDS:-900}
  AUTH_RESET_EMAIL_LIMIT: ${AUTH_RESET_EMAIL_LIMIT:-3}
  AUTH_RESET_IP_LIMIT: ${AUTH_RESET_IP_LIMIT:-10}
  AUTH_INVITE_OWNER_LIMIT: ${AUTH_INVITE_OWNER_LIMIT:-10}
  AUTH_INVITE_WINDOW_SECONDS: ${AUTH_INVITE_WINDOW_SECONDS:-3600}
  AUTH_INVITE_RECIPIENT_SECONDS: ${AUTH_INVITE_RECIPIENT_SECONDS:-60}
  CSV_MAX_BYTES: ${CSV_MAX_BYTES:-10485760}
  CSV_MAX_ROWS: ${CSV_MAX_ROWS:-10000}
  CSV_PREVIEW_TTL_SECONDS: ${CSV_PREVIEW_TTL_SECONDS:-3600}
services:
  db:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql]
    networks: [database]
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    build: { context: ., target: migrate }
    environment: *app-environment
    networks: [database]
    depends_on:
      db: { condition: service_healthy }
    restart: 'no'
  app:
    build: { context: ., target: runner }
    environment: *app-environment
    networks: [database, web]
    depends_on:
      migrate: { condition: service_completed_successfully }
      db: { condition: service_healthy }
    restart: unless-stopped
  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    environment:
      CADDY_HOST: ${CADDY_HOST:?Set CADDY_HOST}
      TRUSTED_PROXY_SECRET: ${TRUSTED_PROXY_SECRET:?Set TRUSTED_PROXY_SECRET}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    depends_on:
      app: { condition: service_healthy }
    restart: unless-stopped
networks:
  database: { internal: true }
  web:
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
